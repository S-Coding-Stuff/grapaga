[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-project"
version = "0.1.0"
description = "Graph algorithms and benchmark utilities"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
gnn = [
    "torch",
    "torch-geometric",
]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.17.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphsys", "graphsys.*", "gnnsys", "gnnsys.*"]
namespaces = false

[tool.setuptools.package-data]
"gnnsys" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["graphsys"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "D"]
ignore = [
    "D100",  # Module docstrings optional
    "D104",  # Package docstrings optional
    "D102",  # Public method docstrings optional
    "D105",  # Special-method docstrings optional
    "D107",  # Constructor docstrings optional
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]
